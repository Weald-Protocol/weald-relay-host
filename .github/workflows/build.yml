# The build, on every push and pull request.
#
# What this cannot do is cut the release. Notarization needs the Developer ID
# identity and the notarytool credential, both of which live in one login
# keychain on the maintainer's Mac and are not going into repository secrets, so
# `scripts/release.sh` is run there and this workflow proves the thing that
# actually breaks: that the source still compiles for both architectures and
# still assembles into a bundle a status bar app can be.
#
# So a red run here means the next release would have failed at step one, and a
# green run means nothing about signatures.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      - name: Build the universal bundle
        run: ./scripts/build-app.sh release

      - name: Check what the script assembled
        run: |
          set -euo pipefail
          APP="build/Weald Relay Host.app"
          test -x "$APP/Contents/MacOS/WealdRelayHost"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          # A status bar app with no LSUIElement is a Dock icon and a stray
          # window, which is a shipped bug rather than a build failure, so it is
          # asserted here where it is free to catch.
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist" | grep -qx true
          # Both architectures, because the download is one file for every Mac.
          lipo -archs "$APP/Contents/MacOS/WealdRelayHost" | tee /dev/stderr | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/WealdRelayHost" | grep -q arm64
          codesign --verify --deep --strict "$APP"

      - name: The tag and the bundle agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          # A tag that disagrees with the bundle ships a v0.3.0 app inside a
          # v0.4.0 release, and the About box is the only place anybody would
          # ever notice.
          [ "$TAG" = "$PLIST" ] || {
            echo "tag v$TAG carries a bundle stamped $PLIST" >&2
            exit 1
          }
